<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numas AI</title>
    <meta name="description" content="Numas — 牛马新伙伴,未来我说了算" />
    <meta name="theme-color" content="#6d5ef5" />

    <script>
      // numas: 冷启动首帧预置布局态, 消除 left slot「先折叠(49px)后展开」的闪烁.
      // 必须在框架 bundle 执行前运行: 框架首帧 SplitPanel 宽度由 localStorage 'layout'
      // 决定 (getStorageValue), 无该 key 时 left 按 49px 折叠渲染, 待 onDidStart
      // restoreTabbarService 消费 defaultPanels 后才展开 → 肉眼可见闪烁.
      // 仅当 'layout' key 不存在(从未使用)时写默认展开态; 用户一旦折叠/拖拽, 框架即写入
      // 该 key, 此后一律尊重用户态, 永不覆盖. size 对齐 App.tsx panelSizes, 避免宽度跳变.
      (function () {
        try {
          if (!localStorage.getItem('layout')) {
            localStorage.setItem('layout', JSON.stringify({
              left: { currentId: 'explorer', size: 268 },
              right: { currentId: 'chat-panel', size: 468 },
              bottom: { currentId: '' },
            }));
          }
        } catch (e) { /* localStorage 不可用时退化为框架默认行为 */ }

        // numas: 快照官方 workbench tab 缓存 (editor.restore → scoped:{ws}:/workbench).
        // 必须在框架 bundle 前执行: opensumi storage 的 debounce flush 会在启动早期把
        // 空的 grid 状态异步写回, 覆盖官方恢复要读的 uris → 官方恢复读空失败 + 欢迎页误开.
        // 这里提前把 uris 快照到 window, 由 contribution/editor-restore 在官方恢复落空后兜底恢复.
        try {
          var __wbSnap = [];
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key && /\/workbench$/.test(key) && key.indexOf('scoped:') === 0) {
              try {
                var raw = localStorage.getItem(key);
                var parsed = raw ? JSON.parse(raw) : null;
                var grid = parsed && parsed.grid ? JSON.parse(parsed.grid) : null;
                var list = (grid && grid.editorGroup && grid.editorGroup.uris) || [];
                for (var j = 0; j < list.length; j++) {
                  if (typeof list[j] === 'string' && list[j].indexOf('file://') === 0) __wbSnap.push(list[j]);
                }
              } catch (e2) { /* 单 key 解析失败跳过 */ }
            }
          }
          window.__NUMAS_WB_URIS__ = __wbSnap;
        } catch (e3) { /* 忽略 */ }
      })();
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #root {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
