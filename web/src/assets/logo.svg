<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- 牛脸: 上弧 (额头) + Y (脸下半: 两角 + 鼻梁) -->

  <!-- 上弧 (大圆弧, 牛脸额头) -->
  <path d="M 8 38 Q 8 8 32 8 Q 56 8 56 38" fill="#fbbf24" stroke="#451a03" stroke-width="3" stroke-linejoin="round"/>

  <!-- Y 字 (两臂 = 牛角 + 竖 = 鼻梁) -->
  <!-- 左臂 (左牛角) -->
  <path d="M 14 36 L 20 36 L 28 50 L 30 50 L 26 56 L 24 50 L 14 36 Z" fill="#451a03" stroke="#1c0701" stroke-width="1" stroke-linejoin="round"/>
  <!-- 右臂 (右牛角) -->
  <path d="M 50 36 L 44 36 L 36 50 L 34 50 L 38 56 L 40 50 L 50 36 Z" fill="#451a03" stroke="#1c0701" stroke-width="1" stroke-linejoin="round"/>
  <!-- 竖 (鼻梁) -->
  <rect x="30" y="36" width="4" height="22" fill="#451a03" stroke="#1c0701" stroke-width="0.8"/>

  <!-- 眼 (鼻梁两侧 2 个点, 大圆白眼 + 黑瞳 + 高光) -->
  <circle cx="20" cy="30" r="5" fill="#ffffff" stroke="#451a03" stroke-width="1.2"/>
  <circle cx="20" cy="30" r="2.5" fill="#1b1140"/>
  <circle cx="18.5" cy="28.5" r="1.2" fill="#ffffff"/>

  <circle cx="44" cy="30" r="5" fill="#ffffff" stroke="#451a03" stroke-width="1.2"/>
  <circle cx="44" cy="30" r="2.5" fill="#1b1140"/>
  <circle cx="42.5" cy="28.5" r="1.2" fill="#ffffff"/>

  <!-- 腮红 (粉, 装饰) -->
  <ellipse cx="14" cy="44" rx="3" ry="2" fill="#fb7185" opacity="0.5"/>
  <ellipse cx="50" cy="44" rx="3" ry="2" fill="#fb7185" opacity="0.5"/>

  <!-- 鼻底 (小横线) -->
  <ellipse cx="32" cy="50" rx="3" ry="1.5" fill="#fda4af" stroke="#9f1239" stroke-width="0.6"/>
  <ellipse cx="30.5" cy="50" rx="0.4" ry="0.6" fill="#1b1140"/>
  <ellipse cx="33.5" cy="50" rx="0.4" ry="0.6" fill="#1b1140"/>

  <!-- 嘴 (微笑) -->
  <path d="M 28 56 Q 32 58 36 56" stroke="#451a03" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
