<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <linearGradient id="horse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cow-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- ============== 马 (底层, 卡通黄马, 被压扁 + 垮裤) ============== -->
  <!-- 马身: 扁椭圆, 卡通圆润 -->
  <path d="M10 38 Q12 30 22 30 L40 32 Q48 33 50 36 L48 42 L14 42 Z" fill="url(#horse)" stroke="#92400e" stroke-width="1.2"/>
  <!-- 马鬃 (深橙, 卡通锯齿) -->
  <path d="M13 32 L15 25 L17 30 L19 24 L21 29 L23 25 L25 30 L20 33 Z" fill="#c2410c" stroke="#7c2d12" stroke-width="0.8"/>

  <!-- 马头 (前左下垂, 卡通大鼻) -->
  <path d="M48 36 L58 30 L62 36 L62 44 L54 46 L48 42 Z" fill="url(#horse)" stroke="#92400e" stroke-width="1.2"/>
  <!-- 马耳朵 -->
  <path d="M52 30 L50 25 L55 28 Z" fill="url(#horse)" stroke="#92400e" stroke-width="1"/>
  <path d="M55 30 L55 24 L58 30 Z" fill="url(#horse)" stroke="#92400e" stroke-width="1"/>
  <!-- 闭眼 (X_X 累死) -->
  <path d="M53 38 L56 40 M56 38 L53 40" stroke="#1b1140" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 嘴 (苦笑) -->
  <path d="M54 43 Q56 42 58 44" stroke="#1b1140" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- 汗滴 -->
  <ellipse cx="48" cy="33" rx="1.2" ry="1.8" fill="#3b82f6"/>

  <!-- 马腿 (4条, 卡通粗短) -->
  <rect x="14" y="42" width="4" height="12" rx="1.5" fill="url(#horse)" stroke="#92400e" stroke-width="1"/>
  <rect x="20" y="42" width="4" height="12" rx="1.5" fill="url(#horse)" stroke="#92400e" stroke-width="1"/>
  <rect x="42" y="42" width="4" height="12" rx="1.5" fill="url(#horse)" stroke="#92400e" stroke-width="1"/>
  <rect x="48" y="42" width="4" height="12" rx="1.5" fill="url(#horse)" stroke="#92400e" stroke-width="1"/>
  <!-- 蹄 (深棕) -->
  <rect x="13" y="52" width="6" height="3" rx="1" fill="#1b1140"/>
  <rect x="19" y="52" width="6" height="3" rx="1" fill="#1b1140"/>
  <rect x="41" y="52" width="6" height="3" rx="1" fill="#1b1140"/>
  <rect x="47" y="52" width="6" height="3" rx="1" fill="#1b1140"/>
  <!-- 马尾巴 (甩, 卡通卷) -->
  <path d="M10 36 Q4 34 4 40 Q3 46 6 46 L8 44 L8 40 Q11 38 10 36 Z" fill="url(#horse)" stroke="#92400e" stroke-width="1"/>

  <!-- 垮裤: 蓝色, 掉到大腿, 露出屁股 -->
  <path d="M17 40 L43 40 L44 48 L40 54 L36 54 L36 48 L24 48 L24 54 L20 54 L16 48 Z" fill="url(#pants)" stroke="#1e3a8a" stroke-width="1.2"/>
  <rect x="16" y="39" width="28" height="3" fill="#0f172a"/>
  <rect x="29" y="39" width="3" height="3" fill="#fbbf24" stroke="#92400e" stroke-width="0.6"/>
  <!-- 裤褶皱 -->
  <line x1="22" y1="45" x2="22" y2="51" stroke="#1e3a8a" stroke-width="0.8" opacity="0.6"/>
  <line x1="30" y1="45" x2="30" y2="51" stroke="#1e3a8a" stroke-width="0.8" opacity="0.6"/>
  <line x1="38" y1="45" x2="38" y2="51" stroke="#1e3a8a" stroke-width="0.8" opacity="0.6"/>
  <!-- 露出马屁股 -->
  <rect x="10" y="36" width="5" height="4" fill="url(#horse)" stroke="#92400e" stroke-width="1"/>

  <!-- ============== 牛 (上层, 骑在马背, 戴耳机, 黑白奶牛) ============== -->
  <!-- 牛身 (白圆胖) -->
  <ellipse cx="28" cy="26" rx="9" ry="5.5" fill="url(#cow-body)" stroke="#1b1140" stroke-width="1.2"/>
  <!-- 牛的黑斑 (不规则大块) -->
  <path d="M20 25 Q23 22 27 25 Q27 28 24 29 Q19 28 20 25 Z" fill="#1b1140"/>
  <path d="M30 23 Q34 22 35 25 Q34 28 31 28 Q28 27 30 23 Z" fill="#1b1140"/>
  <path d="M35 27 Q37 27 37 29 Q35 30 34 28 Z" fill="#1b1140"/>

  <!-- 牛头 (白圆脸) -->
  <circle cx="22" cy="22" r="7.5" fill="url(#cow-body)" stroke="#1b1140" stroke-width="1.2"/>
  <!-- 牛头黑斑 (额头+一边脸) -->
  <path d="M16 18 Q19 16 22 19 Q21 22 17 22 Q14 21 16 18 Z" fill="#1b1140"/>
  <path d="M26 17 Q29 17 29 20 Q27 21 25 20 Z" fill="#1b1140"/>
  <!-- 牛角 (浅米黄, 弯曲卡通) -->
  <path d="M17 18 Q14 11 18 13 Q20 15 20 17 Z" fill="#fde68a" stroke="#92400e" stroke-width="0.8"/>
  <path d="M27 18 Q30 11 26 13 Q24 15 24 17 Z" fill="#fde68a" stroke="#92400e" stroke-width="0.8"/>
  <!-- 牛耳 (粉内, 卡通大耳) -->
  <ellipse cx="15" cy="24" rx="2.2" ry="1.6" fill="#d6d3d1" stroke="#1b1140" stroke-width="0.8" transform="rotate(-30 15 24)"/>
  <ellipse cx="15" cy="24" rx="1.2" ry="0.8" fill="#fda4af" transform="rotate(-30 15 24)"/>
  <ellipse cx="29" cy="24" rx="2.2" ry="1.6" fill="#d6d3d1" stroke="#1b1140" stroke-width="0.8" transform="rotate(30 29 24)"/>
  <ellipse cx="29" cy="24" rx="1.2" ry="0.8" fill="#fda4af" transform="rotate(30 29 24)"/>
  <!-- 牛眼 (大圆黑眼, 呆萌专注) -->
  <circle cx="20" cy="22" r="1.6" fill="#1b1140"/>
  <circle cx="20.5" cy="21.5" r="0.5" fill="#fff"/>
  <circle cx="25" cy="22" r="1.6" fill="#1b1140"/>
  <circle cx="25.5" cy="21.5" r="0.5" fill="#fff"/>
  <!-- 牛鼻 (粉红大鼻) -->
  <ellipse cx="22" cy="26" rx="2.4" ry="1.5" fill="#fda4af" stroke="#1b1140" stroke-width="0.6"/>
  <ellipse cx="21.2" cy="26" rx="0.4" ry="0.6" fill="#1b1140"/>
  <ellipse cx="22.8" cy="26" rx="0.4" ry="0.6" fill="#1b1140"/>
  <!-- 笑嘴 (卡通) -->
  <path d="M21 28 Q22 29 23 28" stroke="#1b1140" stroke-width="0.8" fill="none" stroke-linecap="round"/>

  <!-- 牛腿 (前两条垂在马身侧, 白色 + 黑蹄) -->
  <rect x="22" y="29" width="2.6" height="9" rx="0.8" fill="url(#cow-body)" stroke="#1b1140" stroke-width="0.8"/>
  <rect x="30" y="29" width="2.6" height="9" rx="0.8" fill="url(#cow-body)" stroke="#1b1140" stroke-width="0.8"/>
  <!-- 腿上的小黑斑 -->
  <circle cx="23" cy="33" r="0.8" fill="#1b1140"/>
  <circle cx="31" cy="35" r="0.8" fill="#1b1140"/>
  <rect x="21.4" y="37" width="3.8" height="2" rx="0.5" fill="#1b1140"/>
  <rect x="29.4" y="37" width="3.8" height="2" rx="0.5" fill="#1b1140"/>

  <!-- ============== 耳机 (彩色彩虹, 卡通大耳罩) ============== -->
  <!-- 头带 (彩虹渐变弧) -->
  <path d="M10 24 Q10 6 22 6 Q34 6 34 24" fill="none" stroke="url(#hp)" stroke-width="3" stroke-linecap="round"/>
  <!-- 左耳罩 (黑外壳, 彩虹圈) -->
  <rect x="7" y="20" width="6" height="9" rx="2" fill="#1b1140"/>
  <circle cx="10" cy="24.5" r="2.2" fill="url(#hp)"/>
  <circle cx="10" cy="24.5" r="1" fill="#1b1140"/>
  <!-- 右耳罩 -->
  <rect x="31" y="20" width="6" height="9" rx="2" fill="#1b1140"/>
  <circle cx="34" cy="24.5" r="2.2" fill="url(#hp)"/>
  <circle cx="34" cy="24.5" r="1" fill="#1b1140"/>
</svg>
