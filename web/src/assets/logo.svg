<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1140"/>
      <stop offset="55%" stop-color="#3b1d8f"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="horse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </linearGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- ============== 马 (底层, 被压扁 + 垮裤) ============== -->
  <!-- 马身: 扁椭圆, 后半段比前半低 (被压弯) -->
  <path d="M10 38 Q12 30 22 30 L40 32 Q48 33 50 36 L48 41 L14 42 Z" fill="url(#horse)"/>
  <!-- 马鬃 (背上) -->
  <path d="M14 32 L17 27 L19 30 L21 26 L23 30 L25 28 L20 33 Z" fill="#7c2d12" opacity="0.7"/>

  <!-- 马头 (前左下垂, 累) -->
  <path d="M50 36 L58 32 L60 36 L60 42 L54 44 L50 41 Z" fill="url(#horse)"/>
  <!-- 马耳朵 -->
  <path d="M52 30 L51 27 L54 30 Z" fill="url(#horse)"/>
  <path d="M55 30 L55 26 L57 30 Z" fill="url(#horse)"/>
  <!-- 闭眼 + 累嘴 (两个倒 V) -->
  <path d="M53 39 L55 38 L57 39" stroke="#1b1140" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M55 42 L57 41" stroke="#1b1140" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 马腿 (4条, 短, 撑地) -->
  <rect x="14" y="42" width="3" height="11" rx="1" fill="url(#horse)"/>
  <rect x="20" y="42" width="3" height="11" rx="1" fill="url(#horse)"/>
  <rect x="42" y="42" width="3" height="11" rx="1" fill="url(#horse)"/>
  <rect x="47" y="42" width="3" height="11" rx="1" fill="url(#horse)"/>
  <!-- 蹄 -->
  <rect x="13" y="52" width="5" height="2.5" rx="0.8" fill="#1b1140"/>
  <rect x="19" y="52" width="5" height="2.5" rx="0.8" fill="#1b1140"/>
  <rect x="41" y="52" width="5" height="2.5" rx="0.8" fill="#1b1140"/>
  <rect x="46" y="52" width="5" height="2.5" rx="0.8" fill="#1b1140"/>
  <!-- 马尾巴 (下垂) -->
  <path d="M10 36 Q5 36 5 42 Q5 46 7 47 L9 44 L8 40 Z" fill="url(#horse)"/>

  <!-- 垮裤: 腰在马腹, 裤腿掉到马小腿中段 -->
  <!-- 裤腰 + 裤身 -->
  <path d="M18 41 L42 41 L43 47 L40 53 L36 53 L36 47 L24 47 L24 53 L20 53 L17 47 Z" fill="#1e40af"/>
  <!-- 裤腰带 -->
  <rect x="17" y="40" width="26" height="2" fill="#0f172a"/>
  <!-- 裤带扣 -->
  <rect x="29" y="40" width="2" height="2" fill="#fbbf24"/>
  <!-- 裤褶皱线 -->
  <line x1="22" y1="44" x2="22" y2="50" stroke="#0f172a" stroke-width="0.6" opacity="0.5"/>
  <line x1="30" y1="44" x2="30" y2="50" stroke="#0f172a" stroke-width="0.6" opacity="0.5"/>
  <line x1="38" y1="44" x2="38" y2="50" stroke="#0f172a" stroke-width="0.6" opacity="0.5"/>
  <!-- 裤子下滑 (露出马屁股一小段) -->
  <rect x="11" y="38" width="4" height="3" fill="url(#horse)"/>

  <!-- ============== 牛 (上层, 骑在马背上, 戴耳机) ============== -->
  <!-- 牛身 (小, 只露前半身骑在马背) -->
  <ellipse cx="28" cy="26" rx="9" ry="5" fill="url(#cow)"/>
  <!-- 牛的斑纹 -->
  <ellipse cx="25" cy="27" rx="2.5" ry="1.5" fill="#1b1140" opacity="0.7"/>
  <ellipse cx="32" cy="25" rx="1.5" ry="1" fill="#1b1140" opacity="0.6"/>

  <!-- 牛头 (前左上, 比马头高) -->
  <circle cx="22" cy="22" r="7" fill="url(#cow)"/>
  <!-- 牛角 (向上) -->
  <path d="M18 18 Q16 12 19 14 Q20 16 21 17 Z" fill="#fef3c7" stroke="#92400e" stroke-width="0.6"/>
  <path d="M26 18 Q28 12 25 14 Q24 16 23 17 Z" fill="#fef3c7" stroke="#92400e" stroke-width="0.6"/>
  <!-- 牛耳 -->
  <ellipse cx="16" cy="24" rx="2" ry="1.4" fill="#a8a29e" transform="rotate(-30 16 24)"/>
  <ellipse cx="28" cy="24" rx="2" ry="1.4" fill="#a8a29e" transform="rotate(30 28 24)"/>
  <!-- 牛眼 (专注) -->
  <circle cx="20" cy="22" r="1.2" fill="#1b1140"/>
  <circle cx="20.3" cy="21.7" r="0.4" fill="#fff"/>
  <circle cx="25" cy="22" r="1.2" fill="#1b1140"/>
  <circle cx="25.3" cy="21.7" r="0.4" fill="#fff"/>
  <!-- 牛鼻 -->
  <ellipse cx="22" cy="25" rx="2" ry="1.3" fill="#fda4af"/>
  <ellipse cx="21.3" cy="25" rx="0.3" ry="0.5" fill="#1b1140"/>
  <ellipse cx="22.7" cy="25" rx="0.3" ry="0.5" fill="#1b1140"/>

  <!-- 牛腿 (前两条垂在马身侧) -->
  <rect x="22" y="29" width="2.4" height="9" rx="0.8" fill="url(#cow)"/>
  <rect x="30" y="29" width="2.4" height="9" rx="0.8" fill="url(#cow)"/>
  <!-- 牛蹄 -->
  <rect x="21.4" y="37" width="3.6" height="2" rx="0.5" fill="#1b1140"/>
  <rect x="29.4" y="37" width="3.6" height="2" rx="0.5" fill="#1b1140"/>

  <!-- ============== 耳机 (跨过牛头) ============== -->
  <!-- 头带 (弧形, 跨过牛角上方) -->
  <path d="M11 24 Q11 8 22 8 Q33 8 33 24" fill="none" stroke="url(#hp)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 左耳罩 -->
  <rect x="8" y="20" width="5" height="8" rx="1.5" fill="#0f172a"/>
  <rect x="9" y="21" width="3" height="6" rx="1" fill="url(#hp)" opacity="0.85"/>
  <!-- 右耳罩 -->
  <rect x="31" y="20" width="5" height="8" rx="1.5" fill="#0f172a"/>
  <rect x="32" y="21" width="3" height="6" rx="1" fill="url(#hp)" opacity="0.85"/>
</svg>
